source: paper/dac_layout_query_revision/main.tex
default: Full
selection_status: post-hoc analysis of existing confirmation results
coverage:
  domains: [public, reference, to_asap7]
  conditions: [In/random, In/block, Out/random, Out/block, Boundary]
  holdout: [0.1, 0.3, 0.5, 0.7]
  seeds: [11, 29, 47, 71, 101]
  aggregation: unchanged process/family/component macro NRMSE then mask mean
  tolerance: 8 * float32 epsilon * max(abs(a), abs(b)); no denominator epsilon
